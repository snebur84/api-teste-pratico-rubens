services:
  db:
    image: postgres:15
    container_name: db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    build: { context: ., dockerfile: Dockerfile }
    container_name: api
    environment:
      DB_HOST: db
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  db_data: